name: Publish draw snapshot

on:
  schedule:
    # Every 5 minutes, deliberately off the hour: scheduled runs bunch up at :00 and get
    # queued behind everyone else's. GitHub does not guarantee punctuality either way.
    - cron: '1-56/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest draws
        run: node .github/scripts/snapshot.mjs

      - name: Commit if changed
        run: |
          git config user.name "kino-snapshot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first: `git diff` alone ignores untracked files, so on the very first
          # run it reports "no change" and the snapshot never gets committed.
          git add draws.json
          if git diff --cached --quiet; then
            echo "snapshot unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "Update draw snapshot"
          git push
